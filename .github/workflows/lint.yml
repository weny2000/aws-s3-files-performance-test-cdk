name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install ruff aws-cdk-lib constructs

      - name: Lint with ruff
        run: ruff check .

      - name: Validate CDK synthesises
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: |
          npm install -g aws-cdk
          cdk synth --context account=123456789012 --context region=ap-northeast-1 \
            --no-lookups 2>&1 | tail -5
